<svg width="1360" height="700" viewBox="0 0 1360 700" xmlns="http://www.w3.org/2000/svg">
  <!--
    The menu as it actually behaves: two levels.

    Left  - level 1. "Search all tools" first, then the sections with their
            counts. The whole arsenal is never dumped here, so the default view
            stays short and readable.
    Right - level 2. Either the whole arsenal or one section, filtered as you
            type. The tool name is padded to a fixed column so the descriptions
            line up as a real second column instead of a ragged dump.

    Counts and rows are taken from a real index.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0708"/>
      <stop offset="1" stop-color="#070405"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="26" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1360" height="700" fill="url(#bg)"/>

  <!-- ================= level 1: search entry + sections ================= -->
  <g filter="url(#sh)" transform="translate(40 40)">
    <rect x="0" y="0" width="580" height="600" rx="14" fill="#0a0607" stroke="#ff2b2b" stroke-width="1.2"/>

    <!-- brand / input bar -->
    <rect x="0" y="0" width="580" height="72" rx="14" fill="#160a0b"/>
    <rect x="0" y="58" width="580" height="14" fill="#160a0b"/>
    <line x1="0" y1="72" x2="580" y2="72" stroke="#ff2b2b" stroke-width="1"/>
    <g transform="translate(24 23)">
      <path d="M 12 0 L 26 26 L 20 26 L 12 12 L 4 26 L -2 26 Z" fill="#ff2b2b"/>
    </g>
    <text x="62" y="44" font-family="JetBrainsMono Nerd Font, monospace" font-weight="700"
          font-size="20" letter-spacing="1"><tspan fill="#f0e6e6">BLACK</tspan><tspan fill="#ff2b2b">ARCH</tspan></text>
    <text x="556" y="44" text-anchor="end" font-family="JetBrainsMono Nerd Font, monospace"
          font-size="14" fill="#5a4848">type to filter…</text>

    <!-- status: a single short line, so it never wraps -->
    <rect x="0" y="72" width="580" height="32" fill="#100a0b"/>
    <line x1="0" y1="104" x2="580" y2="104" stroke="#21100f" stroke-width="1"/>
    <text x="24" y="93" font-family="JetBrainsMono Nerd Font, monospace" font-size="13"
          fill="#ff7a45">4181 tools · type to search</text>

    <g font-family="JetBrainsMono Nerd Font, monospace" font-size="15">
      <!-- selected row: Search all tools -->
      <g transform="translate(13 116)">
        <rect x="0" y="0" width="554" height="40" rx="9" fill="#2a0b0e"/>
        <rect x="0" y="0" width="3" height="40" rx="1.5" fill="#ff2b2b"/>
        <circle cx="26" cy="19" r="6" fill="none" stroke="#ff7a45" stroke-width="2"/>
        <line x1="30" y1="23" x2="34" y2="27" stroke="#ff7a45" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="25" fill="#f4ecec" font-weight="700">Search all tools</text>
        <text x="542" y="25" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">type any tool name  ›</text>
      </g>

      <!-- sections: marker, name, count, drill chevron -->
      <g fill="#b09a9a">
        <g transform="translate(13 164)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Recon</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">640 tools  ›</text></g>
        <g transform="translate(13 202)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Scanner</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">962 tools  ›</text></g>
        <g transform="translate(13 240)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Web App</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">505 tools  ›</text></g>
        <g transform="translate(13 278)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Fuzzer</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">305 tools  ›</text></g>
        <g transform="translate(13 316)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Exploitation</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">509 tools  ›</text></g>
        <g transform="translate(13 354)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Cracker</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">339 tools  ›</text></g>
        <g transform="translate(13 392)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Passwords &amp; Crypto</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">167 tools  ›</text></g>
        <g transform="translate(13 430)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Windows &amp; AD</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">134 tools  ›</text></g>
        <g transform="translate(13 468)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Backdoor &amp; Post</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">165 tools  ›</text></g>
        <g transform="translate(13 506)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Sniffer &amp; MitM</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">284 tools  ›</text></g>
        <g transform="translate(13 544)"><rect x="20" y="12" width="9" height="9" rx="2" fill="#ff2b2b"/><text x="46" y="24">Wireless</text><text x="542" y="24" text-anchor="end" fill="#6a5555" font-size="13" xml:space="preserve">178 tools  ›</text></g>
      </g>
    </g>

    <!-- scrollbar: 27 sections, so the thumb sits high and short -->
    <rect x="572" y="116" width="3" height="466" rx="1.5" fill="#0f0809"/>
    <rect x="572" y="116" width="3" height="190" rx="1.5" fill="#ff2b2b"/>
  </g>
  <text x="40" y="664" font-family="JetBrainsMono Nerd Font, monospace" font-size="13"
        fill="#5a4848">level 1 · one search entry + 27 sections</text>

  <!-- ================= drill arrow ================= -->
  <g transform="translate(648 340)">
    <line x1="0" y1="0" x2="46" y2="0" stroke="#ff2b2b" stroke-width="2"/>
    <path d="M 46 -7 L 62 0 L 46 7 Z" fill="#ff2b2b"/>
    <text x="31" y="-16" text-anchor="middle" font-family="JetBrainsMono Nerd Font, monospace"
          font-size="12" fill="#6a5555">ENTER</text>
    <text x="31" y="26" text-anchor="middle" font-family="JetBrainsMono Nerd Font, monospace"
          font-size="12" fill="#6a5555">ESC</text>
    <line x1="62" y1="12" x2="16" y2="12" stroke="#5a2a2a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 16 5 L 2 12 L 16 19 Z" fill="#5a2a2a"/>
  </g>

  <!-- ================= level 2: the tools ================= -->
  <g filter="url(#sh)" transform="translate(740 40)">
    <rect x="0" y="0" width="580" height="600" rx="14" fill="#0a0607" stroke="#ff2b2b" stroke-width="1.2"/>

    <!-- prompt bar, mid-search -->
    <rect x="0" y="0" width="580" height="72" rx="14" fill="#160a0b"/>
    <rect x="0" y="58" width="580" height="14" fill="#160a0b"/>
    <line x1="0" y1="72" x2="580" y2="72" stroke="#ff2b2b" stroke-width="1"/>
    <g transform="translate(24 23)">
      <path d="M 12 0 L 26 26 L 20 26 L 12 12 L 4 26 L -2 26 Z" fill="#ff2b2b"/>
    </g>
    <text x="62" y="45" font-family="JetBrainsMono Nerd Font, monospace" font-size="17"
          xml:space="preserve"><tspan fill="#ff2b2b" font-weight="700">Recon</tspan><tspan fill="#f4ecec">   ad</tspan></text>
    <rect x="164" y="31" width="2" height="19" fill="#ff7a45"/>

    <rect x="0" y="72" width="580" height="32" fill="#100a0b"/>
    <line x1="0" y1="104" x2="580" y2="104" stroke="#21100f" stroke-width="1"/>
    <text x="24" y="93" font-family="JetBrainsMono Nerd Font, monospace" font-size="13"
          fill="#ff7a45">ESC · back to menu</text>

    <!-- Rows. The name is padded to a fixed width, so every description starts
         at the same x (dashed guide). Matching is substring, so "ad" returns
         names that contain "ad" — not fuzzy's scattered-letter guesses. -->
    <line x1="246" y1="112" x2="246" y2="572" stroke="#2a1416" stroke-width="1" stroke-dasharray="3 5"/>

    <g font-family="JetBrainsMono Nerd Font, monospace" font-size="13.5">
      <g transform="translate(13 116)">
        <rect x="0" y="0" width="554" height="36" rx="9" fill="#2a0b0e"/>
        <rect x="0" y="0" width="3" height="36" rx="1.5" fill="#ff2b2b"/>
        <text x="22" y="23" fill="#f4ecec" font-weight="700">activedirectoryenum</text>
        <text x="246" y="23" fill="#9a7d7d">Enumerate AD through LDAP.</text>
      </g>
      <g>
        <g transform="translate(13 156)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">addr6</text><text x="246" y="23" fill="#9a7d7d">SI6 Networks' IPv6 Toolkit.</text></g>
        <g transform="translate(13 194)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">adexplorersnapshot</text><text x="246" y="23" fill="#9a7d7d">AD Explorer snapshot parser.</text></g>
        <g transform="translate(13 232)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">adfind</text><text x="246" y="23" fill="#9a7d7d">Simple admin panel finder for …</text></g>
        <g transform="translate(13 270)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">adidnsdump</text><text x="246" y="23" fill="#9a7d7d">Active Directory Integrated DN…</text></g>
        <g transform="translate(13 308)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">ad-ldap-enum</text><text x="246" y="23" fill="#9a7d7d">An LDAP based Active Directory…</text></g>
        <g transform="translate(13 346)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">ad-miner</text><text x="246" y="23" fill="#9a7d7d">Active Directory audit tool th…</text></g>
        <g transform="translate(13 384)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">autorecon</text><text x="246" y="23" fill="#9a7d7d">A multi-threaded network recon…</text></g>
        <g transform="translate(13 422)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">badkarma</text><text x="246" y="23" fill="#9a7d7d">Advanced network reconnaissanc…</text></g>
        <g transform="translate(13 460)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">badministration</text><text x="246" y="23" fill="#9a7d7d">A tool which interfaces with m…</text></g>
        <g transform="translate(13 498)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">belati</text><text x="246" y="23" fill="#9a7d7d">The Traditional Swiss Army Kni…</text></g>
        <g transform="translate(13 536)"><text x="22" y="23" fill="#e4d8d8" font-weight="700">bloodhound</text><text x="246" y="23" fill="#9a7d7d">Six Degrees of Domain Admin</text></g>
      </g>
    </g>

    <rect x="572" y="116" width="3" height="466" rx="1.5" fill="#0f0809"/>
    <rect x="572" y="116" width="3" height="232" rx="1.5" fill="#ff2b2b"/>
  </g>
  <text x="740" y="664" font-family="JetBrainsMono Nerd Font, monospace" font-size="13"
        fill="#5a4848">level 2 · type to filter · ENTER launches the tool</text>
</svg>
