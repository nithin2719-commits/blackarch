<svg width="1100" height="720" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0607"/>
      <stop offset="1" stop-color="#060304"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="1100" height="720" fill="#050304"/>

  <g filter="url(#sh)" transform="translate(40 32)">
    <rect x="0" y="0" width="1020" height="656" rx="12" fill="url(#bg)" stroke="#2a1113" stroke-width="1"/>

    <!-- titlebar -->
    <rect x="0" y="0" width="1020" height="40" rx="12" fill="#160a0b"/>
    <rect x="0" y="28" width="1020" height="12" fill="#160a0b"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6" fill="#27c93f"/>
    <text x="510" y="25" text-anchor="middle" font-family="JetBrainsMono Nerd Font, monospace"
          font-size="13" fill="#9a7d7d">BlackArch :: xsss</text>

    <g font-family="JetBrainsMono Nerd Font, monospace" transform="translate(40 78)">
      <!-- wordmark -->
      <text x="0" y="34" font-weight="700" font-size="34" letter-spacing="1">
        <tspan fill="#f0e6e6">BLACK</tspan><tspan fill="#ff2b2b">ARCH</tspan>
      </text>
      <text x="0" y="86" font-weight="700" font-size="46" fill="#f0e6e6" letter-spacing="3">XSSS</text>

      <!-- subtitle -->
      <text x="2" y="120" font-size="15">
        <tspan fill="#9a7d7d">A brute force cross site scripting scanner.</tspan><tspan fill="#5a4848">    ·  xsss  ·  0.40b-9</tspan>
      </text>

      <!-- USAGE & FLAGS heading -->
      <g transform="translate(0 156)">
        <rect x="0" y="-13" width="5" height="17" fill="#ff2b2b"/>
        <text x="16" y="0" font-weight="700" font-size="15" fill="#ff2b2b">USAGE &amp; FLAGS</text>
      </g>

      <g font-size="14.5" fill="#9a7d7d">
        <text x="16" y="196"><tspan fill="#c8b6b6">Usage:</tspan></text>
        <text x="16" y="220"><tspan fill="#c8b6b6">  /usr/bin/xsss [options] url ...</tspan></text>

        <text x="16" y="262"><tspan fill="#c8b6b6">Valid options:</tspan></text>
        <text x="40" y="290"><tspan fill="#ff7a45">--forms</tspan>, <tspan fill="#ff7a45">--queries</tspan>, <tspan fill="#ff7a45">--pathinfo</tspan>  <tspan fill="#ff7a45">--list</tspan>=file  <tspan fill="#ff7a45">--depth</tspan>=n  <tspan fill="#ff7a45">--help</tspan></text>

        <text x="40" y="330"><tspan fill="#ff7a45">--forms</tspan>     enables forms scanning (disabled by default)</text>
        <text x="40" y="358"><tspan fill="#ff7a45">--noqueries</tspan> disables query string scanning (enabled by default)</text>
        <text x="40" y="386"><tspan fill="#ff7a45">--list</tspan>=file  scans a list of URLs from a file</text>
        <text x="40" y="414"><tspan fill="#ff7a45">--depth</tspan>=n    limit levels of recursion. default is 5</text>
        <text x="40" y="442"><tspan fill="#ff7a45">--maxcount</tspan>=n limit number of requests. default 1000</text>
      </g>

      <!-- footer help line -->
      <text x="16" y="486" font-size="14" xml:space="preserve"><tspan fill="#ff7a45">run</tspan><tspan fill="#f0e6e6"> xsss ...</tspan><tspan fill="#5a4848">        </tspan><tspan fill="#ff7a45">man</tspan><tspan fill="#f0e6e6"> man xsss</tspan><tspan fill="#5a4848">        </tspan><tspan fill="#ff7a45">exit</tspan><tspan fill="#9a7d7d"> close window</tspan></text>

      <!-- two-line scoped prompt -->
      <g transform="translate(0 512)" font-size="14.5">
        <text x="0" y="0">
          <tspan fill="#5a4848">┌─[</tspan><tspan fill="#ff2b2b" font-weight="700">xsss</tspan><tspan fill="#5a4848">]─[</tspan><tspan fill="#9a7d7d">~</tspan><tspan fill="#5a4848">]─[</tspan><tspan fill="#ff7a45">✔</tspan><tspan fill="#5a4848">]─[</tspan><tspan fill="#9a7d7d">11:12</tspan><tspan fill="#5a4848">]</tspan>
        </text>
        <text x="0" y="26">
          <tspan fill="#5a4848">└─</tspan><tspan fill="#ff2b2b">❯</tspan><tspan fill="#f0e6e6"> _</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
