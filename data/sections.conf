# BlackArch Toolbox sections.
#
# Ordered by how an engagement actually runs -- recon, scan, exploit, escalate,
# then the specialist benches -- rather than alphabetically, so the menu reads
# like the workflow instead of a dictionary.
#
# Format:  <icon>|<display name>|<token>[,<token>...]
#
# The tokens are the toolbox's own distro-neutral category names. Each package
# backend maps its native grouping onto them (BlackArch pacman groups on Arch,
# the bundled catalogue everywhere else), which is what keeps one section list
# correct across every distribution instead of maintaining one per platform.
#
# Icons are Nerd Font glyphs (monospace, single cell) -- NOT emoji, which
# render from a colour-emoji font at a different width and knock the menu
# columns out of alignment. Menus without a Nerd Font fall back cleanly: the
# glyph degrades to a blank cell, the layout still lines up.

